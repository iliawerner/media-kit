<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Title — Design Lovers</title>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #FFFF00;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Панель управления */
        #controls-wrapper {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 15, 20, 0.85);
            border-radius: 12px;
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 280px;
            overflow: hidden;
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 430px;
        }
        #controls-wrapper.collapsed {
            height: 50px;
        }
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            height: 20px;
        }
        #controls-wrapper.collapsed .controls-header {
            border-bottom: 1px solid transparent;
        }
        #toggle-controls {
            font-size: 18px;
            line-height: 1;
            transition: transform 0.3s;
        }
        #controls-wrapper.collapsed #toggle-controls {
            transform: rotate(-180deg);
        }
        #controls-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 1;
            transition: opacity 0.2s ease;
        }
        #controls-wrapper.collapsed #controls-body {
            opacity: 0;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        textarea#text-input {
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
            resize: vertical;
            min-height: 60px;
            line-height: 1.4;
        }
        textarea#text-input:focus {
            border-color: #ff8800;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #ff8800;
        }
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div id="controls-wrapper">
        <div class="controls-header" id="controls-header">
            <span>Настройки</span>
            <span id="toggle-controls">▼</span>
        </div>
        <div id="controls-body">
            <div class="control-group">
                <label for="text-input">Текст</label>
                <textarea id="text-input" autocomplete="off" rows="2" spellcheck="false">Design Lovers</textarea>
            </div>

            <div class="divider"></div>

            <div class="control-group">
                <label for="font-size-range"><span>Размер шрифта</span> <span id="val-fontsize">auto</span></label>
                <input type="range" id="font-size-range" min="0" max="400" step="10" value="0">
            </div>

            <div class="control-group">
                <label for="anim-speed"><span>Скорость анимации</span> <span id="val-speed">1.0x</span></label>
                <input type="range" id="anim-speed" min="0.1" max="4" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <label for="anim-amount"><span>Амплитуда</span> <span id="val-amount">1.0</span></label>
                <input type="range" id="anim-amount" min="0" max="3" step="0.1" value="1.0">
            </div>

            <div class="divider"></div>

            <div class="control-group">
                <label for="blur-range">Интенсивность Heat Map</label>
                <input type="range" id="blur-range" min="0" max="0.15" step="0.005" value="0.06">
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================
        // КЛАСС БУКВЫ — только idle-анимация
        // Рендеринг идентичен оригиналу:
        //   textAlign = 'center', textBaseline = 'middle'
        //   x0 = startX + letterWidth/2  (центр буквы)
        //   translate(x0 + budge, cy) → scale → fillText(char, 0, 0)
        // ============================================
        class KineticLetter {
            constructor(x0, charIndex, phaseIndex, totalLetters, line, fontSize) {
                this.x0 = x0;           // центр буквы по X на текстурном холсте
                this.charIndex = charIndex; // индекс символа в строке
                this.phaseIndex = phaseIndex; // сквозной индекс для фазы анимации
                this.line = line;
                this.fontSize = fontSize;

                // Idle-состояние (инициализируем нулями, обновляем в update)
                this.xScale = 1;
                this.xShear = 0;
                this.xBudgeScale = 0;
                this.xBudgePre = 0;
                this.xBudgePost = 0;
                this.yOffset = 0;
            }

            update(time, speed, amount) {
                const t = time * speed;
                const phase = this.phaseIndex * 0.61803; // золотое сечение

                this.xShear  = Math.cos(t * 0.9 + phase) * 0.03 * amount;
                this.xScale  = 1 + Math.sin(t * 0.7 + phase) * 0.04 * amount;
                this.yOffset = Math.sin(t * 0.5 + phase * 1.3) * (this.fontSize * 0.02) * amount;

                // Компенсация смещения из-за масштаба и shear
                // (точно как в оригинале)
                this.xBudgeScale = (this.xScale * this.fontSize * 0.5) - (this.fontSize * 0.5);
                if (this.xShear < 0) {
                    this.xBudgePost = -Math.tan(this.xShear) * this.fontSize * 0.65;
                    this.xBudgePre  = 0;
                } else {
                    this.xBudgePre  = Math.tan(this.xShear) * this.fontSize * 0.65;
                    this.xBudgePost = 0;
                }
            }

            display(ctx, cy, accumulatedBudge) {
                ctx.save();
                // Оригинальный порядок трансформаций
                ctx.translate(this.x0 + accumulatedBudge + this.xBudgePre, cy + this.yOffset);
                ctx.transform(1, 0, Math.tan(this.xShear), 1, 0, 0);
                ctx.scale(this.xScale, 1);

                ctx.font = `800 ${this.fontSize}px "Abhaya Libre", serif`;
                // fillText(char, 0, 0) работает корректно потому что
                // textAlign='center' и textBaseline='middle' установлены
                // глобально в animate() — как в оригинале
                ctx.fillText(this.line.charAt(this.charIndex), 0, 0);
                ctx.restore();

                return this.xBudgeScale + this.xBudgePost;
            }
        }

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ THREE.JS И WEBGL
        // ============================================
        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const scene  = new THREE.Scene();
        const geometry = new THREE.PlaneGeometry(2, 2);

        // Холст для текста — те же размеры что в оригинале
        const textCanvas = document.createElement('canvas');
        textCanvas.width  = 2048;
        textCanvas.height = 1024;
        const textCtx = textCanvas.getContext('2d');
        const textTexture = new THREE.CanvasTexture(textCanvas);
        textTexture.minFilter = THREE.LinearFilter;
        textTexture.magFilter = THREE.LinearFilter;
        textTexture.generateMipmaps = false;

        // Render target для двухпроходного блюра
        const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
            minFilter: THREE.LinearFilter,
            magFilter: THREE.LinearFilter,
            format: THREE.RGBAFormat
        });

        // Палитра Heat Map (оригинальная)
        const paletteCanvas = document.createElement('canvas');
        paletteCanvas.width  = 256;
        paletteCanvas.height = 1;
        const paletteCtx = paletteCanvas.getContext('2d');
        const grad = paletteCtx.createLinearGradient(0, 0, 256, 0);
        grad.addColorStop(0.00, '#FFFF00');
        grad.addColorStop(0.05, '#FF9900');
        grad.addColorStop(0.15, '#FF0044');
        grad.addColorStop(0.35, '#880088');
        grad.addColorStop(0.60, '#0000AA');
        grad.addColorStop(0.85, '#000044');
        grad.addColorStop(1.00, '#000000');
        paletteCtx.fillStyle = grad;
        paletteCtx.fillRect(0, 0, 256, 1);
        const paletteTexture = new THREE.CanvasTexture(paletteCanvas);

        // Юниформы — без u_mouse (убрана реакция на курсор)
        const uniformsShared = {
            u_time:       { value: 0.0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_max_blur:   { value: 0.06 }
        };

        // --- ШЕЙДЕР ПРОХОД 1: ГОРИЗОНТАЛЬНОЕ РАЗМЫТИЕ ---
        const pass1Material = new THREE.ShaderMaterial({
            uniforms: {
                ...uniformsShared,
                u_text_texture: { value: textTexture }
            },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
            fragmentShader: `
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform sampler2D u_text_texture;
                uniform float u_max_blur;
                varying vec2 vUv;

                float getBlurMap(vec2 uv) {
                    vec2 uvA = uv; uvA.x *= u_resolution.x / u_resolution.y;
                    vec2 h1 = vec2(0.5 + 0.4 * sin(u_time * 0.4), 0.5 + 0.3 * cos(u_time * 0.5));
                    vec2 h2 = vec2(0.5 + 0.3 * cos(u_time * 0.7), 0.5 + 0.4 * sin(u_time * 0.2));
                    h1.x *= u_resolution.x / u_resolution.y;
                    h2.x *= u_resolution.x / u_resolution.y;
                    float val = 0.0;
                    val += 0.5 * smoothstep(0.5, 0.0, distance(uvA, h1));
                    val += 0.5 * smoothstep(0.5, 0.0, distance(uvA, h2));
                    return clamp(val, 0.0, 1.0);
                }

                vec2 getAspectCorrectedUV(vec2 uv) {
                    float screenAspect = u_resolution.x / u_resolution.y;
                    float texAspect = 2.0;
                    vec2 newUV = uv - 0.5;
                    if (screenAspect > texAspect) {
                        newUV.x *= screenAspect / texAspect;
                    } else {
                        newUV.y *= texAspect / screenAspect;
                    }
                    return newUV + 0.5;
                }

                void main() {
                    float blurAmount = getBlurMap(vUv) * u_max_blur;
                    vec2 centerUv = getAspectCorrectedUV(vUv);

                    if (blurAmount < 0.001) {
                        if(centerUv.x < 0.0 || centerUv.x > 1.0 || centerUv.y < 0.0 || centerUv.y > 1.0) {
                            gl_FragColor = vec4(0.0);
                        } else {
                            gl_FragColor = texture2D(u_text_texture, centerUv);
                        }
                        return;
                    }

                    vec4 color = vec4(0.0);
                    float totalWeight = 0.0;
                    float sigma = 5.0;
                    float aspectCorrection = u_resolution.y / u_resolution.x;

                    for(float x = -15.0; x <= 15.0; x += 1.0) {
                        float weight = exp(-(x * x) / (2.0 * sigma * sigma));
                        float offsetAmount = (x / 15.0) * blurAmount;
                        vec2 offset = vec2(offsetAmount * aspectCorrection, 0.0);
                        vec2 sampleUv = centerUv + offset;
                        if(sampleUv.x >= 0.0 && sampleUv.x <= 1.0 && sampleUv.y >= 0.0 && sampleUv.y <= 1.0) {
                            color += texture2D(u_text_texture, sampleUv) * weight;
                            totalWeight += weight;
                        }
                    }
                    gl_FragColor = totalWeight > 0.0 ? (color / totalWeight) : vec4(0.0);
                }
            `
        });

        // --- ШЕЙДЕР ПРОХОД 2: ВЕРТИКАЛЬНОЕ РАЗМЫТИЕ + ЦВЕТА + ЗЕРНО ---
        const pass2Material = new THREE.ShaderMaterial({
            uniforms: {
                ...uniformsShared,
                u_blurred_texture: { value: renderTarget.texture },
                u_sharp_texture:   { value: textTexture },
                u_palette:         { value: paletteTexture }
            },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
            fragmentShader: `
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform sampler2D u_blurred_texture;
                uniform sampler2D u_sharp_texture;
                uniform sampler2D u_palette;
                uniform float u_max_blur;
                varying vec2 vUv;

                float getBlurMap(vec2 uv) {
                    vec2 uvA = uv; uvA.x *= u_resolution.x / u_resolution.y;
                    vec2 h1 = vec2(0.5 + 0.4 * sin(u_time * 0.4), 0.5 + 0.3 * cos(u_time * 0.5));
                    vec2 h2 = vec2(0.5 + 0.3 * cos(u_time * 0.7), 0.5 + 0.4 * sin(u_time * 0.2));
                    h1.x *= u_resolution.x / u_resolution.y;
                    h2.x *= u_resolution.x / u_resolution.y;
                    float val = 0.0;
                    val += 0.5 * smoothstep(0.5, 0.0, distance(uvA, h1));
                    val += 0.5 * smoothstep(0.5, 0.0, distance(uvA, h2));
                    return clamp(val, 0.0, 1.0);
                }

                float random(vec2 st) {
                    return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
                }

                vec2 getAspectCorrectedUV(vec2 uv) {
                    float screenAspect = u_resolution.x / u_resolution.y;
                    float texAspect = 2.0;
                    vec2 newUV = uv - 0.5;
                    if (screenAspect > texAspect) {
                        newUV.x *= screenAspect / texAspect;
                    } else {
                        newUV.y *= texAspect / screenAspect;
                    }
                    return newUV + 0.5;
                }

                void main() {
                    float blurMapValue = getBlurMap(vUv);
                    float blurAmount = blurMapValue * u_max_blur;
                    vec4 blurredColor = vec4(0.0);

                    if (blurAmount < 0.001) {
                        blurredColor = texture2D(u_blurred_texture, vUv);
                    } else {
                        float totalWeight = 0.0;
                        float sigma = 5.0;
                        for(float y = -15.0; y <= 15.0; y += 1.0) {
                            float weight = exp(-(y * y) / (2.0 * sigma * sigma));
                            float offsetAmount = (y / 15.0) * blurAmount;
                            vec2 offset = vec2(0.0, offsetAmount);
                            vec2 sampleUv = vUv + offset;
                            if(sampleUv.y >= 0.0 && sampleUv.y <= 1.0) {
                                blurredColor += texture2D(u_blurred_texture, sampleUv) * weight;
                                totalWeight += weight;
                            }
                        }
                        if (totalWeight > 0.0) blurredColor /= totalWeight;
                    }

                    float intensity = blurredColor.r;
                    vec3 mappedColor = texture2D(u_palette, vec2(intensity, 0.5)).rgb;

                    vec2 sharpUv = getAspectCorrectedUV(vUv);
                    float sharpAlpha = 0.0;
                    if(sharpUv.x >= 0.0 && sharpUv.x <= 1.0 && sharpUv.y >= 0.0 && sharpUv.y <= 1.0) {
                        sharpAlpha = texture2D(u_sharp_texture, sharpUv).r;
                    }

                    vec3 finalColor = mix(mappedColor, vec3(0.0), sharpAlpha * (1.0 - blurMapValue * 2.0));

                    float noiseTime = fract(u_time * 10.0);
                    vec3 grain = vec3(
                        random(vUv + noiseTime),
                        random(vUv + noiseTime + 1.0),
                        random(vUv + noiseTime + 2.0)
                    ) * 2.0 - 1.0;
                    float lum = dot(finalColor, vec3(0.299, 0.587, 0.114));
                    float grainAmount = mix(0.18, 0.04, lum);
                    finalColor += grain * grainAmount;

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, pass1Material);
        scene.add(mesh);

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ БУКВ
        // ============================================
        let kineticLines  = [];
        let currentText   = "Design Lovers";
        let manualFontSize = 0; // 0 = auto

        function calcAutoFontSize(lines) {
            let fontSize = 300;
            const maxW = textCanvas.width  * 0.90;
            const maxH = textCanvas.height * 0.90;

            // Ограничение по ширине самой длинной строки
            for (const line of lines) {
                if (!line) continue;
                textCtx.font = `800 ${fontSize}px "Abhaya Libre", serif`;
                const w = textCtx.measureText(line).width;
                if (w > maxW) fontSize = Math.floor(fontSize * (maxW / w));
            }

            // Ограничение по высоте всех строк
            const lineHeight = fontSize * 1.25;
            const totalH = lineHeight * lines.length;
            if (totalH > maxH) fontSize = Math.floor(fontSize * (maxH / totalH));

            return Math.max(fontSize, 10);
        }

        function initLetters() {
            kineticLines = [];
            const lines    = currentText.split('\n');
            const fontSize = manualFontSize > 0 ? manualFontSize : calcAutoFontSize(lines);
            const lineHeight = fontSize * 1.25;

            // Вертикальное центрирование блока строк
            const totalTextH = lineHeight * lines.length;
            // centerY каждой строки — как в оригинале: textBaseline='middle'
            // поэтому Y = середина строки
            const blockTop = (textCanvas.height - totalTextH) / 2;

            let globalPhase = 0;

            for (let li = 0; li < lines.length; li++) {
                const line = lines[li];
                const cy   = blockTop + li * lineHeight + lineHeight / 2; // середина строки

                // Измеряем ширины букв при нужном размере
                textCtx.font = `800 ${fontSize}px "Abhaya Libre", serif`;
                let totalWidth  = 0;
                const letterWidths = [];
                for (let i = 0; i < line.length; i++) {
                    const w = textCtx.measureText(line[i]).width || (fontSize * 0.6);
                    letterWidths.push(w);
                    totalWidth += w;
                }

                // x0 каждой буквы = центр буквы (как в оригинале: startX + w/2)
                const startX   = (textCanvas.width - totalWidth) / 2;
                let currentX   = startX;
                const lineLetters = [];

                for (let i = 0; i < line.length; i++) {
                    const x0 = currentX + letterWidths[i] / 2;
                    const letter = new KineticLetter(x0, i, globalPhase, line.length, line, fontSize);
                    lineLetters.push({ letter, cy });
                    currentX += letterWidths[i];
                    globalPhase++;
                }

                kineticLines.push(lineLetters);
            }
        }

        // ============================================
        // СОБЫТИЯ UI
        // ============================================
        document.getElementById('text-input').addEventListener('input', (e) => {
            currentText = e.target.value || " ";
            initLetters();
        });
        document.getElementById('blur-range').addEventListener('input', (e) => {
            uniformsShared.u_max_blur.value = parseFloat(e.target.value);
        });
        document.getElementById('anim-speed').addEventListener('input', (e) => {
            document.getElementById('val-speed').innerText = parseFloat(e.target.value).toFixed(1) + 'x';
        });
        document.getElementById('anim-amount').addEventListener('input', (e) => {
            document.getElementById('val-amount').innerText = parseFloat(e.target.value).toFixed(1);
        });
        document.getElementById('font-size-range').addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            manualFontSize = val;
            document.getElementById('val-fontsize').innerText = val > 0 ? val + 'px' : 'auto';
            initLetters();
        });
        document.getElementById('controls-header').addEventListener('click', () => {
            document.getElementById('controls-wrapper').classList.toggle('collapsed');
        });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderTarget.setSize(window.innerWidth, window.innerHeight);
            uniformsShared.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        // ============================================
        // ОСНОВНОЙ ЦИКЛ РЕНДЕРА
        // ============================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            uniformsShared.u_time.value = time;

            const speed  = parseFloat(document.getElementById('anim-speed').value);
            const amount = parseFloat(document.getElementById('anim-amount').value);

            // Очистка холста — идентично оригиналу
            textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            textCtx.fillStyle    = '#ffffff';
            textCtx.textAlign    = 'center';   // ← оригинальное значение
            textCtx.textBaseline = 'middle';   // ← оригинальное значение
            textCtx.filter       = 'none';

            for (const lineLetters of kineticLines) {
                let accumulatedBudge = 0;
                for (const { letter, cy } of lineLetters) {
                    letter.update(time, speed, amount);
                    const budge = letter.display(textCtx, cy, accumulatedBudge);
                    accumulatedBudge += budge;
                }
            }

            textTexture.needsUpdate = true;

            // Проход 1: горизонтальный блюр → буфер
            mesh.material = pass1Material;
            renderer.setRenderTarget(renderTarget);
            renderer.render(scene, camera);

            // Проход 2: вертикальный блюр + цвета + зерно → экран
            mesh.material = pass2Material;
            renderer.setRenderTarget(null);
            renderer.render(scene, camera);
        }

        document.fonts.ready.then(() => {
            initLetters();
            animate();
        });
    </script>
</body>
</html>
